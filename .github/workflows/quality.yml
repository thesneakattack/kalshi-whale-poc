# Woodpecker CI (.woodpecker/quality-frontend-build.yml,
# .woodpecker/quality-architecture-audit.yml - shared portfolio instance at
# portfolio/ci-cd/, see .claude/rules/branching-and-ci.md) is now the
# authoritative executor for
# ordinary push/PR validation. Kept as a manual-trigger fallback, not
# deleted - a working, independently-verified equivalent - but no longer
# runs automatically on every push/PR.
name: quality

on:
  workflow_dispatch: # manual/on-demand fallback - `gh workflow run quality.yml`

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend source
        working-directory: frontend
        run: npm run lint

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

      - name: Verify committed bundle matches source
        run: git diff --exit-code -- static/js/dashboard.bundle.js

  architecture-audit:
    name: architecture-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches tests.yml's pytest job - kept in sync deliberately since
          # tools/quality_audit imports tests/support/runtime_isolation.py's
          # PERSISTENCE_MODULE_PATHS registry.
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Run static quality audit
        run: >
          python -m tools.quality_audit --repo-root .
          --baseline tools/quality_audit/baseline.json
          --json-out build/quality-audit.json

      - name: Check project manifest is current (QCP Task 17)
        run: python -m tools.project_manifest --check static/project-manifest.json --repo-root .

      - name: Upload quality audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-audit-report
          path: build/quality-audit.json

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # static/js/dashboard.bundle.js is gitignored (see frontend-build
      # job's own "Verify committed bundle matches source" step and
      # .gitignore's comment) - a fresh checkout has no bundle at all until
      # this job builds one itself, or the served page's real JS never runs.
      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-selenium.txt

      # requirements-dev.txt alone doesn't have selenium since 42964d8
      # (2026-08-25) split it into its own file for the Woodpecker grid-service
      # setup; this fallback job still runs selenium directly and needs both.
      - run: pip install -r requirements-dev.txt -r requirements-selenium.txt

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Start isolated ASGI server
        run: |
          CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }} \
            python3 -m uvicorn tests.support.e2e_server:app --host 127.0.0.1 --port 8765 \
            > /tmp/e2e-uvicorn.log 2>&1 &

      - name: Wait for server health
        run: python3 -m tests.support.wait_for_health http://127.0.0.1:8765/api/state

      - name: Run browser smoke tests
        env:
          RUN_BROWSER_E2E: "1"
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: python3 -m pytest tests/test_browser_e2e.py -v

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-uvicorn-log
          path: /tmp/e2e-uvicorn.log

  # Add further deterministic Quality Control Plane jobs here as their
  # checker code lands. Keep jobs separate enough that a red check
  # identifies the failure class (frontend/backend contract, browser E2E,
  # project manifest, etc.) instead of hiding everything behind one script.
