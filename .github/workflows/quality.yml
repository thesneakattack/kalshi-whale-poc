name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend source
        working-directory: frontend
        run: npm run lint

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

      - name: Verify committed bundle matches source
        run: git diff --exit-code -- static/js/dashboard.bundle.js

  architecture-audit:
    name: architecture-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches tests.yml's pytest job - kept in sync deliberately since
          # tools/quality_audit imports tests/support/runtime_isolation.py's
          # PERSISTENCE_MODULE_PATHS registry.
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Run static quality audit
        run: >
          python -m tools.quality_audit --repo-root .
          --baseline tools/quality_audit/baseline.json
          --json-out build/quality-audit.json

      - name: Upload quality audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-audit-report
          path: build/quality-audit.json

  # Add further deterministic Quality Control Plane jobs here as their
  # checker code lands. Keep jobs separate enough that a red check
  # identifies the failure class (frontend/backend contract, browser E2E,
  # project manifest, etc.) instead of hiding everything behind one script.
