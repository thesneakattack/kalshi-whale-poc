# Woodpecker CI (.woodpecker/tests-pytest.yml, .woodpecker/tests-
# dependency-audit.yml - shared portfolio instance at portfolio/ci-cd/,
# see .claude/rules/branching-and-ci.md) is now the authoritative executor
# for ordinary push/PR
# validation. This workflow stays as a manual-trigger fallback for when
# Woodpecker is unavailable or a GitHub-native run is specifically wanted -
# not deleted, since it's a working, independently-verified equivalent -
# but no longer runs automatically on every push/PR to avoid paying for
# the same exhaustive checks twice on every commit.
name: tests

on:
  workflow_dispatch: # manual/on-demand fallback - `gh workflow run tests.yml`

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Must match Dockerfile's python:3.13-slim - kalshi-python-async
          # requires Python >=3.13 (every release past the stale 3.2.0
          # does), so this was left behind when the Dockerfile was bumped
          # and CI started failing to even install requirements.txt.
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pip-audit

      # Reads pinned versions straight from the requirements files and
      # checks them against the PyPI vulnerability DB - doesn't need the
      # packages actually installed first. Separate job from pytest above
      # on purpose: a dependency CVE isn't a code regression and its
      # red/green shouldn't be conflated with "did the tests pass."
      - run: pip-audit -r requirements.txt -r requirements-dev.txt
