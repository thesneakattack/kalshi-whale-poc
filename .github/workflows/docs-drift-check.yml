name: docs-drift-check

# Kalshi's API docs don't change often, but docs/kalshi/ is treated as
# ground truth (see CLAUDE.md's "Kalshi API documentation" section) - this
# periodically re-verifies that ground truth instead of trusting it
# indefinitely. Separate from tests.yml on purpose: a broken doc URL or a
# changed page isn't a code regression and shouldn't be read as one.
#
# Upgraded (QCP Task 12, docs/archive/lane-6-observability-quality-safety/plans/
# 2026-08-24-quality-control-plane.md, moved there 2026-09-06, planning-lanes
# migration) from a bare "does each URL still return 200" curl loop to real
# content-drift detection via tools/kalshi_docs_drift.py: every mirrored
# page's freshly-fetched body is hashed (line-endings normalized only) and
# compared against docs/kalshi/upstream-manifest.json, which was built
# from the CURRENT local mirror the last time someone deliberately
# refreshed it. A page returning non-200 is still reported the same way
# the old check did. Originally 17 of 214 entries got availability-only
# checking (2 hand-merged from multiple source URLs, 16 hand-written
# summaries, and the llms.txt index itself); Kalshi Integration Phase A
# Task A1 (2026-08-24) replaced every production-used one of those 16 with
# a real verbatim mirror and split both merged files into one file per
# source URL, so only 2 entries (the one remaining, deliberately deferred,
# non-production-used curated summary get-game-stats.md, and llms.txt
# itself) get availability-only checking now - see
# tools/kalshi_docs_drift.py's own module docstring for the live-verified
# reasoning and docs/kalshi/README.md's per-entry notes for the current
# state.
#
# First real --check run against the internet (2026-08-24, building this
# workflow) found 111 of the 197 content-checked pages had genuinely
# drifted since the 2026-08-16 mirror - see ROADMAP.md for that one-time
# backlog; this scheduled check is what catches drift going forward.
#
# Phase A Task A2 (2026-08-24) added a second, independent check:
# tools/kalshi_docs_sync.py --check fetches llms.txt's own real index and
# diffs its URL set against the manifest (resources + deliberately-
# unsupported specs), catching *index* drift (a page added/removed
# upstream) that kalshi_docs_drift.py's content-hash check can't see at
# all, since it only ever iterates URLs the manifest already knows about.
# First real run building this step found 11 genuinely new upstream pages
# (margin exit-triggers, Get/Set Target Balance Allocation, Get Weather
# Index) not yet mirrored - a real, expected finding per the design spec's
# "global mirror completeness is an initiative goal, not a reason to block
# unrelated migration" scope note, not a bug; deliberately not auto-
# mirrored by this check (see kalshi_docs_sync.py's own module docstring
# for why --check never writes and --write never fetches a page body).
#
# Stays on GitHub Actions (not Woodpecker) deliberately - this is a
# schedule-triggered check, and Woodpecker's cron-trigger mechanism isn't
# set up in this repo (see docs/woodpecker-ci.md, which only documents
# push/PR/manual triggers). Revisit if that ever changes.

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch:

# QCP Task 20: same tests.yml/quality.yml convention - a manual re-trigger
# fired while a previous run of this same workflow is still in flight
# cancels the stale one rather than letting both run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-kalshi-docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Check every mirrored Kalshi doc page for availability + content drift
        id: check
        run: |
          python -m tools.kalshi_docs_drift --check --json-out drift-report.json
        continue-on-error: true

      - name: Check llms.txt's real index for added/removed pages
        id: index_check
        run: |
          python -m tools.kalshi_docs_sync --check --json-out index-drift-report.json
        continue-on-error: true

      - name: Upload drift reports (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-docs-drift-report
          path: |
            drift-report.json
            index-drift-report.json

      - name: Fail the check if content drift, unavailability, or index drift was found
        if: steps.check.outcome == 'failure' || steps.index_check.outcome == 'failure'
        run: |
          echo "::error::docs/kalshi/ may be out of date - see the uploaded drift-report.json/index-drift-report.json artifacts and CLAUDE.md's 'Kalshi API documentation' section for the refresh process. Do not auto-commit a fix; review the actual diff first."
          exit 1
