# Production vhost for the "web" container — the one public entrypoint,
# same split as .ddev/nginx/kalshi-proxy.conf (untouched, that one's ddev's):
# serves static/ directly, reverse-proxies /api/ + /auth/ to "fastapi", which
# has no public exposure of its own. Unlike the ddev version this is a full
# server block, not a snippet included into an existing vhost — nginx:alpine
# has no base vhost to merge into here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://autotrade-fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve Traefik's own X-Forwarded-Proto (https) rather than
        # overwriting it with $scheme, which would read "http" here since
        # nginx itself only ever speaks plain HTTP internally — Traefik is
        # the TLS-terminating hop.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /auth/ {
        proxy_pass http://autotrade-fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Extension-less aliases, same as the ddev snippet.
    location = /status   { add_header Cache-Control "no-store, must-revalidate" always; try_files /status.html   =404; }
    location = /login    { add_header Cache-Control "no-store, must-revalidate" always; try_files /login.html    =404; }
    location = /accounts { add_header Cache-Control "no-store, must-revalidate" always; try_files /accounts.html =404; }

    location ~* \.html$ {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri.html /index.html;
    }
}
