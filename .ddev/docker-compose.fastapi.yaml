# DDEV picks up any docker-compose.*.yaml file in .ddev/ and merges it into the project.
#
# Deliberately NOT publicly exposed (no HTTP_EXPOSE/HTTPS_EXPOSE/VIRTUAL_HOST
# here) - this is an internal-only API service, reachable from other
# containers on the project network as "fastapi:8000" and nowhere else.
# ddev's "web" (nginx) container is the one public entrypoint and reverse-
# proxies /api/ and /auth/ back to it (.ddev/nginx/kalshi-proxy.conf); static
# pages are served directly by nginx. This used to be reversed - fastapi
# itself claimed the public hostname and "web" sat there unused, which
# caused ddev-router to register two competing routers for the same
# hostname (see ROADMAP.md for the 403 saga). Splitting frontend/API onto
# separate services, with only one of them public, both fixes that
# structurally and means a separate frontend could call this API directly.

services:
  fastapi:
    container_name: ddev-${DDEV_SITENAME}-fastapi
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    volumes:
      - "../:/app"
      - ".:/mnt/ddev_config:ro"
    working_dir: /app
    # --proxy-headers/--forwarded-allow-ips: this now sits behind two hops
    # (ddev-router -> nginx -> here), so uvicorn needs to trust nginx's
    # X-Forwarded-Proto/Host to get request.url_for() (used by the OAuth
    # redirect_uri) right, rather than resolving to plain http://fastapi:8000.
    # "*" is safe here specifically because this service has no public
    # exposure at all - only other containers on this project's docker
    # network can reach it, so there's no way for an external client to
    # reach it directly and spoof those headers.
    # --reload-exclude: "../:/app" bind-mounts the whole repo root, so
    # uvicorn's watchfiles reloader recursively watches everything under
    # /app by default - including .claude/worktrees/, the directory
    # Claude Code's isolation:"worktree" agents use for parallel work (each
    # is a full nested git checkout, .py files included). A background
    # agent saving files inside its OWN isolated worktree was observed
    # 2026-08-27 restarting this SHARED fastapi process 3x in a row,
    # killing an unrelated ~15-minute live experiment another session had
    # in flight. MUST be an absolute path, not "./.claude/worktrees" or
    # ".claude/worktrees": uvicorn's FileFilter (uvicorn/supervisors/
    # watchfilesreload.py) stores an exclude pattern that resolves to an
    # existing directory as a bare Path(e) - unresolved, not made
    # absolute - then checks `exclude_dir in changed_path.parents`; but
    # watchfiles always yields absolute changed-file paths, and a relative
    # Path never compares equal to an absolute one, so a relative
    # --reload-exclude here would silently match nothing. Confirmed
    # against the actual installed uvicorn 0.32.0/watchfiles 1.2.0 source
    # and empirically (see the fix's commit message for the exact
    # before/after FileFilter() results) - not guessed from CLI --help.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload",
              "--reload-exclude", "/app/.claude/worktrees",
              "--proxy-headers", "--forwarded-allow-ips=*"]
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
