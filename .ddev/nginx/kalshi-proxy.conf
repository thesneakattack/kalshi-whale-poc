# Included by ddev's default vhost (see /etc/nginx/sites-enabled/nginx-site.conf's
# `include /mnt/ddev_config/nginx/*.conf;`) - a snippet, not a full vhost
# takeover, so ddev's TLS/default-docroot handling stays intact.
#
# "web" is the one public entrypoint now (docroot: static, see config.yaml);
# "fastapi" has no exposure of its own, only reachable inside the project's
# docker network as fastapi:8000 - proxy everything backend-shaped there.

location /api/ {
    proxy_pass http://fastapi:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location /auth/ {
    proxy_pass http://fastapi:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Extension-less aliases main.py used to serve directly via FileResponse
# (/status -> static/status.html, etc.) - preserved here so nothing else
# (README, bookmarks, links between these pages) needs to change now that
# nginx serves static/ itself instead.
#
# add_header is repeated in each block rather than relying on the `.html`
# regex location below: try_files serving a *file* parameter (as opposed to
# a bare URI) is handled directly within the current location, it does not
# re-enter location matching the way the `index` directive's fallback does
# - confirmed empirically (root `/` picked up the regex block's header,
# these three didn't, until this was added directly here).
location = /status   { add_header Cache-Control "no-store, must-revalidate" always; try_files /status.html   =404; }
location = /login    { add_header Cache-Control "no-store, must-revalidate" always; try_files /login.html    =404; }
location = /accounts { add_header Cache-Control "no-store, must-revalidate" always; try_files /accounts.html =404; }

# Every page here is a thin, entirely inline HTML/CSS/JS shell that
# re-fetches its own data every few seconds - no separate .js/.css bundle to
# version, no benefit to caching the shell itself. This used to be enforced
# by FileResponse's headers in main.py (NO_CACHE_HEADERS); replicated here
# now that nginx serves these files directly, since browser-heuristic
# caching of an unchanged index.html has already once silently hidden an
# already-shipped panel until a hard refresh.
location ~* \.html$ {
    add_header Cache-Control "no-store, must-revalidate" always;
}
