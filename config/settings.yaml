mode: paper
kalshi:
  base_url: https://external-api.kalshi.com/trade-api/v2
  markets_watchlist:
  - KXBTC15M
  markets_watchlist_mode: merge
  watchlist_size: 150
  max_children_per_parent: 5
  min_volume_24h: 10000
  min_volume_24h_by_series:
    KXBTC15M: 0
  categories:
  - Sports
  - Crypto
  - Climate and Weather
  - Entertainment
  - Economics
  - Politics
  - Mentions
  - Commodities
  - Financials
  - Science and Technology
  - Elections
  live_markets_only: true
  poll_interval_sec: 6
  # P8 Task 39: applies only in streaming mode (_streaming_trade_tape_enabled()),
  # where trading_loop's own REST tick is a safety net, not the primary data
  # path - check_exits/check_pending_fills/position_netting.review already run
  # from the WS ticker path (Task 38), and the five _maybe_* schedulers +
  # candidate_retry run from their own independent loops (Tasks 36-37).
  # poll_interval_sec stays the cadence for non-streaming (REST-primary) mode,
  # unchanged.
  safety_net_interval_sec: 30
  request_timeout_sec: 10
  trade_stream_exchange_wide: true
  market_lifecycle_stream_enabled: true
  top_series_per_category: 30
realtime_data_plane:
  # P3: filters sub-threshold trades in the reader (services/kalshi/
  # websocket.py) instead of the consumer - default false ships as
  # shadow-mode-only (counts ingest.prefiltered.trade, never drops).
  # Flipping this requires a paper-mode soak per the P3 gate criteria in
  # docs/superpowers/plans/2026-08-25-realtime-data-plane-remediation.md.
  reader_gate_enabled: false
  # P4 Task 18: routes decision-critical WS classes (fill/position/
  # lifecycle/control) and bulk market flow (trade/ticker/index/other)
  # onto separate queues with independent consumers, so one slow class
  # can't stall the drain of every other - the 2026-08-29 settlement-
  # cascade drop mechanism. Default false = single queue, today's
  # behavior unchanged. Flip only with a paper-mode soak, same
  # discipline as reader_gate_enabled above.
  two_consumer_mode: true
whale_signal:
  signal_frequency_sec: 12
  whale_size_range:
  - 5000
  - 50000
  bias: random
  live_markets_only: false
strategy:
  name: follow_the_whale
  entry_threshold: 0.55
  max_position_pct: 0.05
  cooldown_sec: 60
  close_window_sec: 2764800
  special_market_min_seconds_to_close: 120
  max_open_positions_per_series: 0
  kelly_fraction_of_cap: 0.3
  min_unit_cost: 0.35
  max_unit_cost: 0.9
  min_whale_winrate_pct: 40
  min_resolved_for_whale_filter: 20
  live_markets_only: false
  excluded_series: []
  take_profit_pct: null
  stop_loss_pct: null
  exit_on_sentiment_reversal: false
  longshot_close_window_sec: 300
  exit_sentiment_min_signals: 15
  exit_sentiment_lean_pct: 90
  auto_exit_enabled: true
  auto_exit_threshold: 0.85
  auto_exit_pnl_weight: 0.85
  auto_exit_sentiment_weight: 1.5
  auto_exit_staleness_weight: 0.5
  auto_exit_analyst_weight: 0.5
  auto_exit_gain_reference_pct: 0.15
  auto_exit_loss_reference_pct: 0.85
  auto_exit_stale_after_sec: 7200
  auto_exit_normal_volatility: 0.002
  auto_exit_volatility_lookback_sec: 1800
  auto_exit_series_track_record_weight: 0
  longshot_price_threshold: 0.05
  longshot_entry_threshold_bonus: 0.05
  use_limit_orders: false
  limit_order_timeout_sec: 60
  min_seconds_to_close: 90
  exit_min_seconds_to_close: null
  # P8 Task 35: when the WS-sourced price check_exits is about to act on is
  # older than this many seconds, the independent REST corroboration read
  # (market_history.recent_price) is TRUSTED over it even within the usual
  # 0.30 deviation floor - WS-primary, REST verifies at decision time. If
  # that read is unavailable too, the exit check still proceeds on the stale
  # value (fail-open, the codebase's uniform rule) but the condition is
  # recorded in fault_log, never silent. Provisional 120.0 matches the
  # existing corroboration window; Task 40's benchmark on real captured
  # cadence data is the owner of re-tuning it. 0 disables the staleness
  # trigger (deviation-only, as before).
  price_staleness_corroborate_sec: 120.0
risk:
  starting_bankroll: 10000
  max_daily_loss_pct: 0.8
  kill_switch_enabled: true
  max_total_exposure_pct: null
kalshi_account:
  trading_enabled: false
whale_watcher_kalshi:
  # Contract count, not dollar notional, is the whale gate (ROADMAP.md,
  # replacing min_notional_usd - a dollar gate is structurally biased
  # toward near-certain prices; see docs/next-session-pickup-2026-08-17.md
  # and services/whalewatchers/kalshi_trade_tape.py's module docstring).
  # 5000 is the measured recommendation (mean unit cost 0.759 vs the old
  # dollar gate's 0.926).
  min_contracts: 10000
  # Same two-tier structure the old min_notional_usd_by_series had (crypto
  # looser than the global default, mention-style markets loosest), same
  # round numbers - but re-validated against real historical signal sizes,
  # not a blind field-rename: signal_log.db's own logged whale-signal sizes
  # for KXTRUMPSAY/KXTRUMPMENTION top out at 3506/4932 contracts, so a flat
  # 5000 global floor with no override would have gone dark on both. 2500/
  # 500 sit at or below every affected series' observed p10, so switching
  # units doesn't silently zero out their signal flow.
  min_contracts_by_series:
    KXBTC15M: 2500
    KXBTCD: 2500
    KXETH15M: 2500
    KXETHD: 2500
    KXTRUMPSAY: 500
    KXTRUMPMENTION: 500
    KXMAMDANIMENTION: 500
# depth_factor/unusualness_factor/proximity_factor floored at the shared
# minimum (0.0404) since 2026-08-10's first real calibration run found
# unusualness_factor/agreement_factor negative. SUPERSEDED 2026-08-30: a
# deeper factor-by-factor audit (docs/superpowers/research/2026-08-30-
# whale-confidence-weights-factor-audit.md, worktree-agent-a5110e2d3016b26a8)
# found the raw tertile-discrimination numbers this file previously quoted
# were mostly measurement artifacts, not real findings - do not re-derive
# weights from a bare gap_pts number without reading that doc first.
# depth_factor's gap is ~40% a zero-24h-volume denominator bug (real gap
# -28.6 -> -17.4 controlled); unusualness_factor's gap is a mathematical
# identity (price already calibrates outcomes; the factor is a non-monotone
# function of that same price, un-measurable by tertile bucketing in either
# direction - do NOT invert it); proximity_factor's gap is mostly a tied-
# at-zero artifact acting as a KXBTC15M series proxy (real gap -3.7, not
# -20.4); context_factor's +24.9 is over half the SAME zero-volume artifact
# as depth_factor, inverted (+11.0 controlled) - `suggested_weights`
# proposing 0.34 for it would harden that artifact into production, not
# fix anything; trend_factor's true effect is LARGER than its reported gap
# because the calibration tool's own tie-detection guard misses a 64.2%-
# tied mode, not smaller. agreement_factor's 2026-08-10 negative finding
# has flipped positive (+12.0pt, still real) and is not re-floored here
# pending a human decision (docs/open-decisions.md). Do not trust this
# module's gap_pts output on any factor until that measurement-instrument
# bug is fixed - it is upstream of every weight decision made from it.
whale_confidence_weights:
  depth_factor: 0.0404
  unusualness_factor: 0.0404
  proximity_factor: 0.0404
  context_factor: 0.2121
  agreement_factor: 0.1818
  cluster_factor: 0.1717
  trend_factor: 0.3131
  analyst_factor: 0.0
  block_trade_factor: 0.0
advisory:
  enabled: true
  min_resolved_trades_per_variant: 10
  auto_apply_enabled: false
  auto_apply_min_confidence: higher
  auto_apply_min_n: 100
  auto_apply_cooldown_sec: 86400
confidence_calibration:
  enabled: true
  min_resolved_signals: 50
  auto_apply_min_resolved_signals: 50
  snapshot_interval_sec: 21600
  auto_apply_enabled: false
  auto_apply_cooldown_sec: 86400
market_analyst:
  enabled: true
  model: claude-sonnet-5
  reanalyze_cooldown_sec: 1800
position_netting:
  enabled: true
  min_dwell_sec: 300
  min_edge_improvement_usd: 50
  normal_volatility: 0.02
  volatility_lookback_sec: 1800
index_feed:
  index_ids:
  - BRTI
  - ETHUSD_RTI
  underlying_tickers:
  - Metal.XAU/USD
  - Metal.XAG/USD
settlement_edge_entry:
  # Acts on the edge services/settlement_edge.py measured (2026-08-23:
  # 27,534 scored observations, projection Brier 0.0171 vs market Brier
  # 0.1046 - see GET /api/diagnostics/settlement-edge). Off by default,
  # same "ships fully built, opt-in" precedent as every other engine here.
  # See services/settlement_edge_entry.py's module docstring.
  enabled: false
  # Only trade once at least this many of the 60 settlement-window
  # observations are known - the measured edge is strongest in the
  # 46-59-known bucket (projection Brier 0.002 vs market 0.1021).
  min_observations_known: 45
  min_probability: 0.95
  # Minimum gap between the projected probability and the market's own
  # price, in probability points, before the edge is worth paying fees on.
  min_edge: 0.05
  max_position_pct: 0.02
  volatility_lookback_sec: 3600
series_watcher:
  enabled: true
  series:
  - KXBTC15M
  - KXETH15M
  - KXBTCD
  - KXETHD
  - KXMLBGAME
  - KXNFLGAME
  - KXNBAGAME
  - KXATPMATCH
  book_snapshot_interval_sec: 5
  retention_hours: 168
series_evaluator:
  enabled: false
  min_observation_sec: 3600
  min_trades_observed: 1000
  max_observation_sec: 21600
  min_qualify_rate: 0.05
  backoff_base_sec: 3600
  backoff_multiplier: 2
  backoff_max_sec: 86400
logging:
  level: INFO
backup:
  enabled: true
  interval_sec: 21600  # 6h - see services/backup/CHEATSHEET.md. Regular
  # tier only (small, account-critical files) as of 2026-08-30 - see
  # large_file_interval_sec below for the second tier.
  retention_count: 14  # ~3.5 days at the default interval. Safe to keep
  # unchanged as of 2026-08-30's tiering split: large_files below (the
  # files that grow without bound per CLAUDE.md's "accumulated history is
  # a first-class asset" rule) are no longer part of this tier's snapshots,
  # so this tier's own files stay single-digit-MB regardless of retention
  # count. Before the split, every snapshot on this cadence carried a full
  # copy of series_watcher.db - measured at 292GB across 13 snapshots once
  # that file alone reached 24.4GB (2026-08-30 investigation, see
  # services/backup/backup.py's module docstring).
  large_files:
    - series_watcher.db
    - candidate_log.db
    - market_history.db
  large_file_interval_sec: 86400  # 24h - deliberately longer than the
  # regular tier's 6h: these files are already durable, continuously-
  # accumulating append logs, so losing a few hours of them to a backup gap
  # costs nothing like losing live trading state would.
  large_file_retention_count: 4  # ~4 days at that cadence.
alerting:
  enabled: true
  webhook_url: null # unset by default - see services/alerting/CHEATSHEET.md for
  # payload shape / which destinations it's compatible with as-is
  crash_auto_resolve_after_sec: 1800 # 30min - a "crash" alert with no repeat
  # in this window auto-resolves (services/alerting/alerting.py's
  # expire_old_alerts). 0/null disables auto-expiry - manual-only via
  # POST /api/alerts/{id}/resolve.
observability:
  enabled: true
  sample_interval_sec: 60
  retention_hours: 336  # 14 days - see services/observability/CHEATSHEET.md
market_history:
  retention_hours: 168  # 7d - momentum()/volatility()/compute_hypothetical_trades()'s
  # longest lookback is 86400s/24h (services/market_history.py's own default
  # lookback_windows_sec); this leaves a wide margin above that. Added
  # 2026-08-30 to close the one retention gap found in data/*.db - see
  # services/market_history.py's prune() docstring.
fault_log:
  retention_hours: 336  # 14 days, matching observability's window - diagnostic/
  # debugging data (services/fault_log.py's own docstring: "logged for
  # analysis later"), not a trading dataset CLAUDE.md's accumulated-history
  # rule covers. Added 2026-08-31: fault_log.db was the one store still
  # missing from main.py's hourly _maybe_prune_capture_stores sweep - its
  # dedup key includes per-instance message text (e.g. a specific ticker),
  # so distinct rows grow with every new market touched, not just with true
  # repeat faults - confirmed via /api/quality/summary's storage-growth
  # check (229KB -> 799KB in 24h) and /api/observability/summary's db.
  # fault_log.db.size_bytes series.
research:
  enabled: false  # off until manually reviewed - see services/research/CHEATSHEET.md
  min_new_resolved_signals: 100
  min_new_closed_trades: 50
event_lifecycle:
  tournament_min_siblings: 4
  tournament_pretail_days: 5.0
  pre_tail_volume_weight: 0.4
  post_tail_volume_weight: 0.2
event_schedule:
  enabled: true
  pre_event_hours: 6.0
  web_search_enabled: true
  max_resolutions_per_tick: 5
strategy_overrides:
  by_category:
    Sports:
      stop_loss_pct: null
  by_series: {}
