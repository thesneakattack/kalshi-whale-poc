strategy:
  name: follow_the_whale
  entry_threshold: 0.75
  max_position_pct: 0.05
  cooldown_sec: 120
  close_window_sec: 7200
  special_market_min_seconds_to_close: 300
  max_open_positions_per_series: 0
  kelly_fraction_of_cap: null
  # 2026-08-15: data-backed price band from 606 real settled trades - the
  # only unit_cost range (side-aware price actually paid per contract) that
  # was net profitable. See services/strategy_engine.py's own comment at
  # this gate for the full per-band breakdown.
  min_unit_cost: 0.5
  max_unit_cost: 0.8
  min_whale_winrate_pct: 85
  min_resolved_for_whale_filter: 20
  live_markets_only: false
  excluded_series: []
  take_profit_pct: null
  stop_loss_pct: null
  exit_on_sentiment_reversal: false
  longshot_close_window_sec: 900
  exit_sentiment_min_signals: 15
  exit_sentiment_lean_pct: 85
  auto_exit_enabled: false
  auto_exit_threshold: 0.9
  auto_exit_pnl_weight: 0.2
  auto_exit_sentiment_weight: 1.5
  auto_exit_staleness_weight: 0.5
  auto_exit_analyst_weight: 0.5
  auto_exit_gain_reference_pct: 0.95
  auto_exit_loss_reference_pct: 0.9
  auto_exit_stale_after_sec: 7200
  auto_exit_normal_volatility: 0.02
  auto_exit_volatility_lookback_sec: 1800
  auto_exit_series_track_record_weight: 0
  longshot_price_threshold: 0.05
  longshot_entry_threshold_bonus: 0.05
# Per-category/per-series overrides on top of strategy.* above - most-
# specific wins (series over category over the flat default). See
# services/config_overrides.py. Migrated 2026-08-15 from the old
# single-field strategy.entry_threshold_by_category, which this
# subsumes - any strategy.* field can be overridden here now, not just
# entry_threshold.
#
# 2026-08-15 data pass (606 real closed whale-follow trades, post fee-
# multiplier fix): computed real per-series/per-unit_cost-bucket win rate,
# net P&L, and - direct request - actual significance, not just eyeballed
# dollar totals: a one-sample t-stat for mean pnl-per-trade vs 0, and a
# one-sample proportion z-score for win rate vs the book's own 68.5%
# overall rate. ~27 series/bucket combinations were tested, so treat
# anything under ~2 sigma with real skepticism (multiple-comparisons risk
# - at a naive threshold, 1-2 "significant-looking" results are expected
# from chance alone across that many tests). Only entries that cleared a
# real bar on BOTH an aggregate (whole-series) AND a bucket-level test are
# below; several plausible-looking findings that did NOT survive this
# check (KXWTAMATCH's net-negative-across-every-bucket pattern: aggregate
# pnl t-stat only -0.98, well within noise; KXITFWMATCH's 0.5-0.8 zone:
# -0.46; KXMLBGAME's real 0.5-0.8-band win-rate gap, z=-3.4, well
# supported at the bucket level but its AGGREGATE t-stat is only -0.35
# because its other bands run positive - a genuine, real, but bimodal
# effect this flat-band override mechanism can't safely express without
# also cutting off zones the data doesn't condemn - are deliberately left
# unshipped rather than forced into a misleading single override) were
# deliberately NOT turned into overrides here - noted so a future pass
# doesn't have to redo the same investigation from scratch.
strategy_overrides:
  by_category: {}
  by_series:
    # 15-minute BTC markets behave nothing like the rest of Crypto (see
    # KXBTCD below) - frequency=fifteen_min (Kalshi's own GET /series
    # metadata), so cooldown_sec: 120 alone already burns 13% of this
    # market's entire lifetime. Real underperformance too: aggregate
    # n=19, mean pnl/trade -$37.60, t=-1.81; its own 0.5-0.8 unit_cost
    # bucket (n=11) win rate is 2.2 sigma below the book's overall rate.
    # Moderate, not overwhelming, significance - shortening cooldown is
    # justified independent of the pnl question; the threshold bump is
    # the more speculative half of this entry.
    KXBTC15M:
      cooldown_sec: 30
      entry_threshold: 0.82
    # Real, well-supported outperformance: aggregate n=57, mean pnl/trade
    # +$15.97, t=+2.23; its 0.5-0.8 bucket (n=23) is +3.6 sigma on pnl and
    # +2.6 sigma on win rate vs the book average - one of the two
    # strongest signals in the whole dataset, positive AND negative
    # findings included. Sized up modestly (not doubled) given this is
    # still real capital-at-risk logic even in paper mode.
    KXMLBSPREAD:
      max_position_pct: 0.07
    # Real, well-supported outperformance: aggregate n=42, win rate 90.5%
    # is 4.9 sigma above the book's own 68.5% overall rate, mean pnl/trade
    # +$11.95 (t=+1.78). Same modest sizing bump as KXMLBSPREAD above, same
    # reasoning.
    KXBTCD:
      max_position_pct: 0.07
