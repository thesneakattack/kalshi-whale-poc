mode: paper
kalshi:
  base_url: https://external-api.kalshi.com/trade-api/v2
  markets_watchlist:
  - KXBTC15M
  watchlist_size: 150
  max_children_per_parent: null
  min_volume_24h: 5000
  min_volume_24h_by_series:
    KXBTC15M: 0
  categories:
  - Sports
  - Crypto
  live_markets_only: false
  poll_interval_sec: 6
  request_timeout_sec: 10
  # Subscribe the trade websocket with no market_tickers, so every print on
  # the exchange arrives instead of only those on the rotating watchlist
  # (docs/kalshi/public-trades.md: "market specification optional"). Costs
  # zero REST tokens - this is push, not poll. Read at startup, so changing
  # it needs a real restart, not a live config reload.
  trade_stream_exchange_wide: true
  top_series_per_category: 30
whale_signal:
  signal_frequency_sec: 12
  whale_size_range:
  - 5000
  - 50000
  bias: random
  live_markets_only: false
strategy:
  name: follow_the_whale
  entry_threshold: 0.65
  max_position_pct: 0.05
  cooldown_sec: 120
  close_window_sec: 8760
  special_market_min_seconds_to_close: 270
  max_open_positions_per_series: 0
  kelly_fraction_of_cap: 0.3
  min_unit_cost: 0.65
  max_unit_cost: 0.8
  min_whale_winrate_pct: 50
  min_resolved_for_whale_filter: 20
  live_markets_only: false
  excluded_series: []
  take_profit_pct: 0.25
  stop_loss_pct: 0.8
  exit_on_sentiment_reversal: false
  longshot_close_window_sec: 900
  exit_sentiment_min_signals: 15
  exit_sentiment_lean_pct: 90
  auto_exit_enabled: true
  auto_exit_threshold: 0.9
  auto_exit_pnl_weight: 0.2
  auto_exit_sentiment_weight: 1.5
  auto_exit_staleness_weight: 0.5
  auto_exit_analyst_weight: 0.5
  auto_exit_gain_reference_pct: 0.95
  auto_exit_loss_reference_pct: 0.85
  auto_exit_stale_after_sec: 7200
  auto_exit_normal_volatility: 0.002
  auto_exit_volatility_lookback_sec: 1800
  auto_exit_series_track_record_weight: 0
  longshot_price_threshold: 0.05
  longshot_entry_threshold_bonus: 0.05
  use_limit_orders: false
  limit_order_timeout_sec: 60
  min_seconds_to_close: 300
  exit_min_seconds_to_close: 120
risk:
  starting_bankroll: 10000
  max_daily_loss_pct: 0.85
  kill_switch_enabled: true
kalshi_account:
  trading_enabled: false
market_strategy:
  enabled: false
  starting_bankroll: 1000000
  max_position_pct: 0.05
  cooldown_sec: 300
  max_open_positions_per_series: null
  kelly_fraction_of_cap: 0
  min_price: 0.15
  max_price: 0.85
  max_spread: 0.05
  min_volume_24h: 500
  momentum_lookback_sec: 1800
  min_momentum_delta: 0.094
  min_seconds_to_close: 3600
  entry_confidence_threshold: 0.405
  take_profit_pct: null
  stop_loss_pct: 0.2
  exit_on_momentum_reversal: true
  max_daily_loss_pct: 1
  kill_switch_enabled: true
whale_watcher_kalshi:
  # Lowered 2026-08-17 after measuring the real flow rather than assuming
  # it. KXBTC15M prints 49,947 times an hour with a MEDIAN notional of $5
  # and a p90 of $72, so a $2,500 floor admitted the top 0.04% - about 20
  # prints/hour, which produced long stretches of a completely empty UI
  # that were indistinguishable from a broken pipeline.
  #
  # Live ingest at the old value: 3,817 websocket messages received, 0
  # dropped, 2,748 prints evaluated by the provider, ZERO clearing the
  # threshold. Nothing was failing; the gate was simply that selective.
  #
  # Measured yield on KXBTC15M: $2,500 -> ~20/hr, $1,000 -> ~71/hr,
  # $500 -> ~282/hr. This does not change signal ACCURACY, only how much
  # of the tape qualifies as a whale print - and CLAUDE.md's hard
  # commandment is judged on win rate paired with entry price, both of
  # which are measured downstream of this.
  min_notional_usd: 5000
  min_notional_usd_by_series:
    KXBTC15M: 2500
    KXBTCD: 2500
    KXETH15M: 2500
    KXETHD: 2500
    KXTRUMPSAY: 500
    KXTRUMPMENTION: 500
    KXMAMDANIMENTION: 500
whale_confidence_weights:
  depth_factor: 0.03
  unusualness_factor: 0.02
  proximity_factor: 0.03
  context_factor: 0.03
  agreement_factor: 0.34
  cluster_factor: 0.18
  trend_factor: 0.2
  analyst_factor: 0
  block_trade_factor: 0.15
advisory:
  enabled: true
  min_resolved_trades_per_variant: 10
  auto_apply_enabled: false
  auto_apply_min_confidence: higher
  auto_apply_min_n: 100
  auto_apply_cooldown_sec: 86400
confidence_calibration:
  enabled: true
  min_resolved_signals: 50
  auto_apply_min_resolved_signals: 50
  snapshot_interval_sec: 21600
  auto_apply_enabled: false
  auto_apply_cooldown_sec: 86400
market_strategy_calibration:
  enabled: true
  min_resolved_trades: 20
market_analyst:
  enabled: true
  model: claude-sonnet-5
  reanalyze_cooldown_sec: 1800
position_netting:
  enabled: true
  min_dwell_sec: 300
  min_edge_improvement_usd: 1
  normal_volatility: 0.02
  volatility_lookback_sec: 1800
index_feed:
  # CF Benchmarks index IDs to stream (docs/kalshi/cfbenchmarks-value.md).
  # These are the quantities the crypto series literally settle against:
  # KXBTC15M/KXBTCD -> BRTI, KXETH15M/KXETHD -> ETHUSD_RTI. The channel's
  # last_60s_windowed_average_15min is the settlement average itself,
  # accumulating one observation per second during the final minute.
  # Use ["all"] to receive every available index.
  index_ids:
    - BRTI
    - ETHUSD_RTI
  # Pyth underlyings (docs/kalshi/pyth-value.md) - a bare price feed, no
  # windowed averages. Empty until there's a market that settles on one.
  underlying_tickers: []
series_watcher:
  enabled: true
  # Raw-print capture is deliberately WIDER than what the strategy trades
  # (2026-08-17). The min_notional gate was measured to be geometrically
  # biased toward near-certain prices - 44 of the 58 prints clearing $2,500
  # sit at unit cost >=0.95 - so if capture were scoped to what passes the
  # filter, the stored history would inherit that same bias and could never
  # be used to evaluate a different filter later. Capturing the full tape
  # for these series keeps the record usable even if the current approach is
  # scrapped entirely.
  series:
    - KXBTC15M
    - KXETH15M
    - KXBTCD
    - KXETHD
    - KXMLBGAME
    - KXNFLGAME
    - KXNBAGAME
    - KXATPMATCH
  book_snapshot_interval_sec: 5
  retention_hours: 168
series_evaluator:
  enabled: false
  min_observation_sec: 3600
  min_trades_observed: 1000
  max_observation_sec: 21600
  min_qualify_rate: 0.05
  backoff_base_sec: 3600
  backoff_multiplier: 2
  backoff_max_sec: 86400
logging:
