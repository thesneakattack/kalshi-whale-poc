mode: paper
kalshi:
  base_url: https://api.elections.kalshi.com/trade-api/v2
  markets_watchlist: []
  watchlist_size: 20
  min_volume_24h: 1
  categories: []
  poll_interval_sec: 15
  request_timeout_sec: 10
whale_signal:
  signal_frequency_sec: 12
  whale_size_range:
  - 5000
  - 50000
  bias: random
  live_markets_only: true
strategy:
  name: follow_the_whale
  entry_threshold: 0.65
  max_position_pct: 0.05
  cooldown_sec: 300
  min_whale_winrate_pct: 40
  min_resolved_for_whale_filter: 5
  live_markets_only: true
  excluded_series: []
  take_profit_pct: null
  stop_loss_pct: null
  exit_on_sentiment_reversal: false
  exit_sentiment_min_signals: 3
  exit_sentiment_lean_pct: 65
  auto_exit_enabled: false
  auto_exit_threshold: 0.6
  auto_exit_pnl_weight: 1
  auto_exit_sentiment_weight: 1
  auto_exit_staleness_weight: 0.5
  auto_exit_gain_reference_pct: 0.5
  auto_exit_loss_reference_pct: 0.3
  auto_exit_stale_after_sec: 1800
risk:
  starting_bankroll: 10000
  max_daily_loss_pct: 1
  kill_switch_enabled: true
kalshi_account:
  trading_enabled: false
market_strategy:
  enabled: false
  starting_bankroll: 10000
  max_position_pct: 0.05
  cooldown_sec: 300
  min_price: 0.15
  max_price: 0.85
  max_spread: 0.05
  min_volume_24h: 500
  momentum_lookback_sec: 1800
  min_momentum_delta: 0.03
  min_seconds_to_close: 3600
  entry_confidence_threshold: 0.5
  take_profit_pct: null
  stop_loss_pct: null
  exit_on_momentum_reversal: false
  max_daily_loss_pct: 1
  kill_switch_enabled: true
advisory:
  enabled: false
  min_resolved_trades_per_variant: 30
  auto_apply_enabled: false
  auto_apply_min_confidence: higher
  auto_apply_cooldown_sec: 86400
logging:
  level: INFO
