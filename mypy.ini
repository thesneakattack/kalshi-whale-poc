; Scoped static type checking for the Kalshi integration boundary
; (Phase C Task C1). Deliberately NOT repo-wide: the check covers
; services/kalshi/ (the one place vendor semantics live) so static
; contract mistakes fail before runtime, without failing the legacy
; application on unrelated typing debt. Widen per-package only with
; evidence, mirroring the C6 rule (types serve correctness, not
; coverage vanity).
;
; explicit_package_bases + mypy_path: services/ has no __init__.py
; (namespace-package style), so without this mypy maps files under two
; module names and refuses to run.
[mypy]
python_version = 3.13
mypy_path = .
explicit_package_bases = True
files = services/kalshi, services/execution.py
; realtime data-plane remediation P0 Task 3: services/whale_gate.py (in
; services/kalshi/websocket.py's import graph, per this plan's explicit
; "reuse services/whalewatchers/kalshi_trade_tape.py's threshold function
; rather than re-deriving it" instruction) pulls in
; services/whalewatchers/kalshi_trade_tape.py, which transitively pulls in
; config_store.py, config_bounds.py, and services/market_analyst_agent/* -
; none of them previously reachable from this scoped check's `files` list.
; Without this, mypy's default import-following reports pre-existing type
; debt in those unrelated legacy modules as if it were new, which is
; exactly the "fail the legacy application on unrelated typing debt" this
; file's own docstring says to avoid. `silent` still follows the imports
; for accurate type inference inside services/kalshi/ itself - only error
; *reporting* for modules outside `files` is suppressed.
follow_imports = silent
; the SDK ships no type stubs; its surface is verified against mirrored
; docs + fixtures instead (tests/test_kalshi_contracts.py)
[mypy-kalshi_python_async.*]
ignore_missing_imports = True

; C3: the contracts package is the canonical semantic surface - every
; def there must be fully annotated (the annotations ARE the contract).
; The transport/gateway modules stay at default strictness; they wrap an
; unstubbed SDK and their correctness lives in fixture tests.
[mypy-services.kalshi.contracts.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
