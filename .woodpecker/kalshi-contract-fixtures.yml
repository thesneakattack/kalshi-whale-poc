# Kalshi-facing contract/fixture tests, isolated into their own named check
# for clearer failure attribution (a red "kalshi-contract" check means a
# Kalshi request/response schema assumption broke, not an unrelated
# regression elsewhere) - these are already exercised by tests-pytest-app.yml's
# full suite too; running them again here is deliberate duplication for
# failure-isolation value, not a replacement for the full suite. No
# real network access - fixture/contract-shape tests only (see
# docs/kalshi/CHEATSHEET.md and the kalshi-contract-review skill); a live
# public API canary is a separate, deliberately scheduled/manual concern
# (not yet built - Quality Control Plane Task 14).
#
# tests/test_kalshi_contracts.py (QCP Task 13, 2026-08-24) added: fixture-
# JSON-driven tests (tests/fixtures/kalshi/*.json, each with a _meta.
# source_doc pointer) that feed canonical Kalshi message/object shapes
# into the same handlers/normalizers production uses. Building it found
# and fixed three real, previously-undetectable bugs (WS fill identity
# keyed on a field the real message doesn't have; WS position dispatch
# checking the plural channel name instead of the real singular
# per-message type; WS position ticker extraction reading the wrong field
# name) - see that test file's own module docstring for the full story.
# Docs-only fast path added 2026-09-03 (CI pipeline audit finding: this
# workflow never checked build/.ci-skip-verdict, unlike tests-pytest-app.yml/
# quality-browser-e2e.yml - a pure docs/.claude-only PR still paid this
# workflow's full ~47s median cost every time). The 6 test files below can
# never be affected by a change confined to docs/.claude - a SKIP verdict
# here is exactly as safe as tests-pytest-app.yml's own use of it. Still runs
# and still posts its required status, only the pytest run inside becomes
# a no-op.
when:
  - event: [push, pull_request]

# Full-history clone override, required by ci-fast-path-check below - same
# reasoning as tests-pytest-app.yml's own identical block.
clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

steps:
  - name: ci-fast-path-check
    image: alpine/git
    commands:
      - mkdir -p build
      - sh scripts/ci-skip-heavy-suite.sh | tee build/.ci-skip-verdict

  - name: kalshi-fixture-contracts
    image: python:3.13-slim
    # Persistent uv download cache, shared across pipelines and runs. uv made
    # installing free (CI log: "Installed 64 packages in 110ms") but a fresh
    # container still re-downloaded every wheel each run - measured at
    # "Prepared 64 packages in 50.50s". This mounts one named Docker volume
    # so that download happens once per package version instead of once per
    # step per push. Measured locally on this exact requirements set: 4.5s
    # cold, 0.875s warm.
    #
    # Safe to share concurrently - uv locks its cache, which matters here
    # because the agent runs WOODPECKER_MAX_WORKFLOWS=4 and several of these
    # steps install at the same time. The repo is already trusted for volumes
    # (volumes/security true, network **false** - confirmed live
    # 2026-09-02), so this needs no settings change (volumes is what this
    # comment is actually about).
    # Prune with `docker volume rm wp-uv-cache` if it ever grows unreasonably;
    # losing it costs one slow run, nothing more.
    volumes:
      - wp-uv-cache:/root/.cache/uv
    commands:
      - |
        if [ "$(cat build/.ci-skip-verdict 2>/dev/null || echo RUN)" = "SKIP" ]; then
          echo "docs/.claude-only change (scripts/ci-skip-heavy-suite.sh) - skipping the kalshi contract/fixture run"
        else
          # uv instead of pip: measured 5s vs 78s for this same
          # requirements-dev.txt on python:3.13-slim (both runs back to
          # back on the same contended host, so the ratio is the
          # meaningful part, not the absolute numbers). Four of this
          # repo's pipelines pay this exact install, and it was the
          # single largest cost in the two slowest steps. --system
          # installs into the image's own interpreter rather than a
          # venv, which is what every step here already assumed pip was
          # doing. Resolution is unchanged: same requirements file, same
          # pins.
          pip install -q uv
          uv pip install --system -r requirements-dev.txt
          python -m pytest -v \
            tests/test_kalshi_client.py \
            tests/test_kalshi_account_client.py \
            tests/test_kalshi_trade_ws.py \
            tests/test_kalshi_fees.py \
            tests/test_whalewatchers_kalshi_trade_tape.py \
            tests/test_kalshi_contracts.py
        fi
