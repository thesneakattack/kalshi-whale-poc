# Real headless-Chrome browser smoke test (Quality Control Plane Task 8) -
# tests/support/e2e_server.py serves the actual FastAPI app + built static
# frontend from one process, isolated from live data/*.db the same way
# every other test is (tests/support/runtime_isolation.py) and with
# state["running"] forced off so nothing here ever makes a real Kalshi
# network call - see that module's own comment. No path filter: the browser
# test exercises the served static/ HTML/CSS/JS through the real backend
# routes, so a change on either side can break it.
when:
  - event: [push, pull_request]

steps:
  # static/js/dashboard.bundle.js is deliberately gitignored (ddev's own
  # post-start hook/watch mode keeps it fresh in dev, see .gitignore's own
  # comment) - a fresh clone here has no bundle at all until this builds
  # one, or the served page's real JS never runs and every test below
  # fails with e.g. `window.showView` undefined (found live: this step was
  # missing on the first push of this pipeline). quality-frontend-build.yml
  # is a separate Woodpecker pipeline with its own independent clone, so
  # its build can't be reused here - this step has to do its own.
  - name: build-frontend
    image: node:22-slim
    commands:
      - cd frontend
      - npm ci
      - npm run build

  - name: browser-e2e
    image: python:3.13-slim
    environment:
      RUN_BROWSER_E2E: "1"
      CHROME_BIN: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
    commands:
      # Same major version for both packages (verified live: apt offers a
      # single matched 151.x candidate for each) avoids the classic
      # chromedriver/Chrome version-skew failure - deliberately not using
      # Selenium Manager's own network-fetched driver.
      - apt-get update -qq
      - apt-get install -y --no-install-recommends chromium chromium-driver > /dev/null
      # uv instead of pip: measured 5s vs 78s for this same
      # requirements-dev.txt on python:3.13-slim (both runs back to back on
      # the same contended host, so the ratio is the meaningful part, not
      # the absolute numbers). Four of this repo's pipelines pay this exact
      # install, and it was the single largest cost in the two slowest
      # steps. --system installs into the image's own interpreter rather
      # than a venv, which is what every step here already assumed pip was
      # doing. Resolution is unchanged: same requirements file, same pins.
      - pip install -q uv
      - uv pip install --system -q -r requirements-dev.txt
      - mkdir -p build
      # build/, not /tmp - each Woodpecker step is its own container, and
      # only the workspace directory (build/ included) is shared across
      # them; the print-server-log step below couldn't see anything written
      # under /tmp here.
      - python3 -m uvicorn tests.support.e2e_server:app --host 127.0.0.1 --port 8765 > build/e2e-uvicorn.log 2>&1 &
      - python3 -m tests.support.wait_for_health http://127.0.0.1:8765/api/state
      - python3 -m pytest tests/test_browser_e2e.py -v

  # Playwright covers what WebDriver structurally cannot: putting the
  # browser's network layer under test control. See
  # tests/test_browser_playwright_e2e.py's docstring for the full reasoning -
  # in short, it forces API failures instead of waiting for one, which turns
  # CLAUDE.md's "a displayed value must match its label" rule into an
  # executable guard rather than prose two shipped bugs already slipped past.
  #
  # Its own step, and its own image, on purpose:
  #   - mcr.microsoft.com/playwright/python ships the browsers prebuilt, so
  #     this pays no download at runtime. The Selenium step above spends
  #     ~2-3 minutes on `apt-get install chromium chromium-driver` every
  #     run; this step deliberately does not repeat that mistake.
  #   - a separate named step means a red check says WHICH stack broke, per
  #     .claude/skills/ci-cd-guardrails' "a red job should tell the developer
  #     what class of problem occurred".
  # The image tag and requirements-playwright.txt's pin must move together.
  #
  # The uv venv is not optional plumbing - this image is Ubuntu 24.04 and
  # ships Python 3.12, while requirements.txt pins kalshi-python-async, which
  # requires >=3.13. The harness imports main, so it genuinely needs the full
  # app dependency set; installing less is not an option. uv provisions 3.13
  # in ~5s and installs everything in ~10s. Verified locally: the venv's
  # playwright still uses the image's prebuilt browsers via
  # PLAYWRIGHT_BROWSERS_PATH=/ms-playwright (chromium-1234), because the
  # pinned package version matches the image's own - which is the entire
  # reason for choosing this image, so keep those two in step.
  - name: playwright-e2e
    image: mcr.microsoft.com/playwright/python:v1.62.0-noble
    environment:
      RUN_PLAYWRIGHT_E2E: "1"
    commands:
      - pip install -q uv
      # Absolute interpreter path rather than exporting PATH: Woodpecker
      # does its own substitution pass over these command strings, and a
      # bare $PATH is needless ambiguity when /venv/bin/python is exact.
      - uv venv --python 3.13 /venv --quiet
      - uv pip install --python /venv/bin/python -q -r requirements-dev.txt -r requirements-playwright.txt
      - mkdir -p build
      # Same server, started fresh: the Selenium step's uvicorn died with its
      # own container. Bound to 127.0.0.1 like that step, since the browser
      # here runs inside this container rather than in a service alongside it.
      - /venv/bin/python -m uvicorn tests.support.e2e_server:app --host 127.0.0.1 --port 8765 > build/playwright-uvicorn.log 2>&1 &
      - /venv/bin/python -m tests.support.wait_for_health http://127.0.0.1:8765/api/state
      # retain-on-failure: a trace is only useful when something broke, and
      # writing one per passing test would cost time and disk for nothing.
      - /venv/bin/python -m pytest tests/test_browser_playwright_e2e.py -v --tracing=retain-on-failure --output=build/playwright-artifacts

  # Woodpecker has no first-class "upload artifact" step (see
  # quality-architecture-audit.yml's own comment on the same pattern) - the
  # server's own log is what a browser-side failure needs to diagnose
  # (a 4xx/5xx or startup error the test surfaced only indirectly).
  - name: print-server-log
    image: python:3.13-slim
    when:
      - event: [push, pull_request]
        status: [failure, success]
    commands:
      - cat build/e2e-uvicorn.log || echo "no selenium server log captured"
      - cat build/playwright-uvicorn.log || echo "no playwright server log captured"
      - ls -R build/playwright-artifacts 2>/dev/null || echo "no playwright traces (nothing failed)"
