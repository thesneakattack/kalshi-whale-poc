# Dependency vulnerability audit - separate workflow from tests-pytest.yml
# on purpose (mirrors the former tests.yml's job split): a dependency CVE
# isn't a code regression and its red/green shouldn't be conflated with
# "did the tests pass." Reads pinned versions straight from the
# requirements files - doesn't need the packages installed first.
#
# Docs-only fast path added 2026-09-03 (CI pipeline audit finding: this
# workflow never checked build/.ci-skip-verdict, unlike tests-pytest.yml/
# quality-browser-e2e.yml - a pure docs/.claude-only PR still paid the full
# pip-audit cost every time, confirmed live at a 32s median in the audit's
# own dataset). Requirements files can never live under docs/.claude, so a
# verdict of SKIP here is exactly as safe as tests-pytest.yml's own use of
# it - this workflow still runs and still posts its required status
# (`ci/woodpecker/{push,pr}/tests-dependency-audit`), only the pip-audit
# work inside it becomes a no-op, same shape as the pattern already proven
# there.
when:
  - event: [push, pull_request]

# Full-history clone override, required by ci-fast-path-check below - same
# reasoning as tests-pytest.yml's own identical block (its own comment has
# the full story: Woodpecker's default clone plugin silently forces
# --depth=1 unless partial:false is also set, and ci-skip-heavy-suite.sh's
# git merge-base/HEAD^1 diff needs real ancestor history to work at all).
clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

steps:
  - name: ci-fast-path-check
    image: alpine/git
    commands:
      - mkdir -p build
      - sh scripts/ci-skip-heavy-suite.sh | tee build/.ci-skip-verdict

  - name: pip-audit
    image: python:3.13-slim
    commands:
      - |
        if [ "$(cat build/.ci-skip-verdict 2>/dev/null || echo RUN)" = "SKIP" ]; then
          echo "docs/.claude-only change (scripts/ci-skip-heavy-suite.sh) - skipping pip-audit"
        else
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt
        fi
