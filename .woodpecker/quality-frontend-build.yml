# Frontend lint/build - mirrors the former quality.yml `frontend-build`
# job (now workflow_dispatch-only there). Path-filtered: this check only
# depends on frontend/ source, so it's safe to skip on a change that
# touches neither (unlike quality-architecture-audit.yml, which reads
# frontend/src/js/*.js too and must NOT be path-filtered away from
# backend-only changes).
#
# No longer diffs static/js/dashboard.bundle.js against git. Found live
# 2026-08-24 (ROADMAP.md): that check was a silent no-op - the bundle is
# gitignored and has zero commits ever, so `git diff --exit-code` on it
# always reported "no difference" regardless of real corruption (confirmed
# by deliberately corrupting the built file and re-running the identical
# check). Removed rather than patched onto a comparison that needs
# something to diff against (re-committing the bundle, or a committed
# hash file) - unnecessary since both this step's own `npm run build` and
# `quality-browser-e2e.yml`'s `build-frontend` step already rebuild the
# bundle from current source on every push; a broken build fails `npm run
# build` directly, and browser-e2e exercises the freshly-built output
# against real routes end to end, which is a stronger signal than a git
# diff on a build artifact ever was.
when:
  - event: [push, pull_request]
    path:
      include:
        - "frontend/**"

steps:
  - name: frontend-build
    image: node:22-slim
    commands:
      - cd frontend
      - npm ci
      - npm run lint
      - npm run build
