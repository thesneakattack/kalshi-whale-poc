# Full backend pytest suite - Woodpecker's authoritative equivalent of the
# GitHub Actions tests.yml `pytest` job (now workflow_dispatch-only there,
# see .github/workflows/tests.yml's own header comment). Runs on every push
# and PR: no path filter, since a change anywhere in services/ or main.py
# can regress any other module (cross-module regressions are exactly what
# the full suite exists to catch - see CLAUDE.md's "Long-session workflow"
# section and .claude/skills/ci-cd-guardrails/SKILL.md).
#
# tests/conftest.py (Task 2 of the Quality Control Plane) redirects every
# persistence module's DB_PATH into a temp dir and hard-blocks sqlite3.connect
# against the real data/ directory before any test can run, so this container
# never touches (and does not even receive) this repo's live data/*.db files.
when:
  - event: [push, pull_request]

steps:
  - name: pytest
    image: python:3.13-slim
    commands:
      # uv instead of pip: measured 5s vs 78s for this same
      # requirements-dev.txt on python:3.13-slim (both runs back to back on
      # the same contended host, so the ratio is the meaningful part, not
      # the absolute numbers). Four of this repo's pipelines pay this exact
      # install, and it was the single largest cost in the two slowest
      # steps. --system installs into the image's own interpreter rather
      # than a venv, which is what every step here already assumed pip was
      # doing. Resolution is unchanged: same requirements file, same pins.
      - pip install -q uv
      - uv pip install --system -r requirements-dev.txt
      # -n 4, not `auto`. `auto` uses every visible core, and the
      # container sees all 16 of the host's - but the shared agent runs
      # WOODPECKER_MAX_WORKFLOWS=4, so four concurrent pytest steps would
      # ask for 64 workers on 16 cores. At 4 the worst case is exactly the
      # core count. Measured on this suite (1574 tests, all green at every
      # setting): 230s serial, 72s at -n 2, 46s at -n 4, 29s at -n 8, 23s at
      # -n auto. Most of the win is already banked by 4, and the remaining
      # 17s is not worth oversubscribing a host that also runs the live ddev
      # stack. Raise it here if the agent's concurrency ever drops.
      #
      # -v dropped deliberately: xdist interleaves workers, so per-test
      # verbose output arrives out of order and is harder to read than the
      # progress line, not easier.
      - python -m pytest -n 4
