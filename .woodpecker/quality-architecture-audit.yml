# Static architecture/quality audit - mirrors the former quality.yml
# `architecture-audit` job (now workflow_dispatch-only there). Runs the
# full tools.quality_audit CLI (Quality Control Plane Tasks 3-7): router/
# background wiring, persistence isolation, resource lifecycle,
# config-usage, API-usage inventory, and the frontend<->backend API
# contract scanner. No path filter - the frontend-api-contract scanner
# reads both services/*/routes.py and frontend/src/js/*.js, so a
# backend-only OR frontend-only change can each independently break it.
#
# Also runs tools.project_manifest --check (QCP Task 17) in the same step,
# bundled rather than a separate step - same "one tools.* static check
# already paid for the pip install, just add another command" pattern this
# step already used to fold frontend-api-contract in alongside
# quality_audit itself. static/project-manifest.json's committed
# generated_from_head/generated_at are deliberately excluded from this
# comparison (see project_manifest.py's own _CHURN_FIELDS) so this never
# fails merely because HEAD moved - a `python:3.13-slim` image has no git
# binary anyway, so generated_from_head always builds as null here
# regardless, which the exclusion makes harmless.
#
# The remaining counts are compared against a relative tolerance rather
# than exactly (project_manifest._DEFAULT_TOLERANCE), so ordinary commit
# churn does not red this pipeline while a genuinely stale manifest still
# does. Sub-threshold drift is printed in this step's log rather than
# suppressed - if those lines are creeping up toward the threshold, run
# `python3 -m tools.project_manifest --write static/project-manifest.json
# --repo-root .` on the host (not via ddev exec: no git binary there).
when:
  - event: [push, pull_request]

steps:
  - name: architecture-audit
    image: python:3.13-slim
    # Persistent uv download cache, shared across pipelines and runs. uv made
    # installing free (CI log: "Installed 64 packages in 110ms") but a fresh
    # container still re-downloaded every wheel each run - measured at
    # "Prepared 64 packages in 50.50s". This mounts one named Docker volume
    # so that download happens once per package version instead of once per
    # step per push. Measured locally on this exact requirements set: 4.5s
    # cold, 0.875s warm.
    #
    # Safe to share concurrently - uv locks its cache, which matters here
    # because the agent runs WOODPECKER_MAX_WORKFLOWS=4 and several of these
    # steps install at the same time. The repo is already trusted for volumes
    # (network/volumes/security all true), so this needs no settings change.
    # Prune with `docker volume rm wp-uv-cache` if it ever grows unreasonably;
    # losing it costs one slow run, nothing more.
    volumes:
      - wp-uv-cache:/root/.cache/uv
    commands:
      # uv instead of pip: measured 5s vs 78s for this same
      # requirements-dev.txt on python:3.13-slim (both runs back to back on
      # the same contended host, so the ratio is the meaningful part, not
      # the absolute numbers). Four of this repo's pipelines pay this exact
      # install, and it was the single largest cost in the two slowest
      # steps. --system installs into the image's own interpreter rather
      # than a venv, which is what every step here already assumed pip was
      # doing. Resolution is unchanged: same requirements file, same pins.
      - pip install -q uv
      - uv pip install --system -r requirements-dev.txt
      - >
        python -m tools.quality_audit --repo-root .
        --baseline tools/quality_audit/baseline.json
        --json-out build/quality-audit.json
      - python -m tools.project_manifest --check static/project-manifest.json --repo-root .
      # Scoped static type check of the Kalshi integration boundary
      # (Phase C Task C1, mypy.ini pins scope to services/kalshi/). A
      # separately identifiable command so a type failure reads as a type
      # failure in the log, not as a generic audit error.
      - python -m mypy --config-file mypy.ini

  # Woodpecker has no first-class "upload artifact" step; the JSON report
  # is exposed as build log output instead so a failing run's evidence
  # stays inspectable without needing separate artifact storage.
  - name: print-report
    image: python:3.13-slim
    when:
      - event: [push, pull_request]
        status: [failure, success]
    commands:
      - cat build/quality-audit.json
